services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: interview-promo-db
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_promo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_promo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
