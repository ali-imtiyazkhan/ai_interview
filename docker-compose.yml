services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: interview-promo-db
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_promo
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_promo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: interview-promo-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://interview:interview@postgres:5432/interview_promo
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: interview-promo-web
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      - backend

volumes:
  pgdata:
